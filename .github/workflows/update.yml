name: WLFI Staking Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run monitor
        env:
          INFURA_KEY: ${{ secrets.INFURA_KEY }}
        run: python wlfi_monitor.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add staking_history.csv wlfi_dashboard.html
          git commit -m "update dashboard" || echo "no changes"
          git push
